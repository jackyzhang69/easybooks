[package]
name = "jz-plugin-common"
version = "0.1.0"
edition = "2021"
description = "Shared plugin capabilities: auth, http, tell-jacky, pair-session, signals, envelope, home, doctor"
license = "MIT OR Apache-2.0"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
mockito = "1"
tempfile = "3"
