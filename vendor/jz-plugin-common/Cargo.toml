[package]
name = "jz-plugin-common"
version = "0.1.0"
edition = "2021"
description = "Shared plugin capabilities: auth, http, tell-jacky, pair-session, signals, envelope, home, doctor"
license = "MIT OR Apache-2.0"

[dependencies]
a2a = { package = "a2a-lf", version = "=0.3.0", optional = true }
a2a-client = { package = "a2a-client-lf", version = "=0.2.3", default-features = false, features = ["native-tls"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"], optional = true }
tokio = { version = "1", features = ["rt", "time", "net"], optional = true }
futures = { version = "0.3", optional = true }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
uuid = { version = "1", features = ["v4"] }

[features]
pair-a2a = ["dep:a2a", "dep:a2a-client", "dep:reqwest", "dep:tokio", "dep:futures"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
futures = "0.3"
mockito = "1"
tempfile = "3"

[[example]]
name = "pair_a2a_probe"
required-features = ["pair-a2a"]
