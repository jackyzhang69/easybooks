[workspace]
resolver = "2"
members = [
    "cli",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.5.22"
authors = ["Jacky Zhang <jackyzhang1969@gmail.com>"]
repository = "https://github.com/jackyzhang69/easybooks-plugin"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
