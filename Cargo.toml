[workspace]
resolver = "2"
members = [
    "cli",
]
# Vendored from the platform repo (vendor/jz-plugin-lifecycle/SOURCE_REV); never edit in place.
exclude = ["vendor/jz-plugin-lifecycle"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.5.28"
authors = ["Jacky Zhang <jackyzhang1969@gmail.com>"]
repository = "https://github.com/jackyzhang69/easybooks"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
