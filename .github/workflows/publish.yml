name: build-sign-plugin

on:
  push:
    tags:
      - 'plugin-v*'
  workflow_dispatch:

concurrency:
  group: easybooks-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign:
    runs-on: [self-hosted, macOS, ARM64, easybooks-plugin-signing]
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
      STAGE: /tmp/easybooks-plugin-build-stage
      IS_TAG: ${{ github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Ensure Rust targets
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add aarch64-apple-darwin
          "$HOME/.cargo/bin/rustup" target add x86_64-pc-windows-gnu
          test -x /opt/homebrew/bin/x86_64-w64-mingw32-gcc
          /opt/homebrew/bin/x86_64-w64-mingw32-gcc --version >/dev/null

      - name: Verify tag and source version
        if: env.IS_TAG == 'true'
        run: |
          set -euo pipefail
          bash scripts/assert-plugin-version-bumped.sh
          python3 scripts/assert_plugin_version.py --tag "$VERSION" --root .

      - name: Verify source
        run: |
          set -euo pipefail
          bash scripts/official-plugin/seed-jz-plugin-common.sh
          bash scripts/sync-skills.sh
          "$HOME/.cargo/bin/cargo" clippy --workspace --all-targets -- -D warnings
          "$HOME/.cargo/bin/cargo" test --workspace --all-targets
          "$HOME/.cargo/bin/cargo" build --release --bin easybooks
          BIN="$("$HOME/.cargo/bin/cargo" metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')/release/easybooks"
          python3 scripts/assert-skill-surface.py \
            --bin "$BIN" \
            --skills "$(pwd)/.claude/skills/easybooks"

      - name: Build release binaries
        run: |
          set -euo pipefail
          "$HOME/.cargo/bin/cargo" build --release --target aarch64-apple-darwin --bin easybooks
          "$HOME/.cargo/bin/cargo" build --release --target x86_64-pc-windows-gnu --bin easybooks

      - name: Require signing configuration
        env:
          CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CODESIGN_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"

      - name: Require marketplace deploy key
        if: env.IS_TAG == 'true'
        env:
          PLUGINS_REPO_DEPLOY_KEY: ${{ secrets.PLUGINS_REPO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PLUGINS_REPO_DEPLOY_KEY}" ]; then
            echo "::error::PLUGINS_REPO_DEPLOY_KEY is empty; refusing official plugin publish"
            exit 1
          fi

      - name: Bootstrap isolated signing keychain
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bash scripts/official-plugin/sign-macos-cli.sh bootstrap

      - name: Assemble CLI stage
        run: |
          set -euo pipefail
          rm -rf "$STAGE"
          mkdir -p "$STAGE/cli-aarch64-apple-darwin" "$STAGE/cli-x86_64-pc-windows-gnu"
          cp target/aarch64-apple-darwin/release/easybooks "$STAGE/cli-aarch64-apple-darwin/easybooks"
          cp target/x86_64-pc-windows-gnu/release/easybooks.exe "$STAGE/cli-x86_64-pc-windows-gnu/easybooks.exe"
          chmod +x "$STAGE/cli-aarch64-apple-darwin/easybooks"

      - name: Official plugin release-lane preflight
        run: |
          set -euo pipefail
          bash scripts/official-plugin/stage-identity-package.sh "$RUNNER_TEMP/easybooks-identity-package"
          bash scripts/official-plugin/verify-plugin-identity.sh "$RUNNER_TEMP/easybooks-identity-package"
          bash scripts/assemble-official-plugin.sh "$STAGE" "$RUNNER_TEMP/easybooks-staged-plugin"
          STAGED="$RUNNER_TEMP/easybooks-staged-plugin"
          receipt="$RUNNER_TEMP/easybooks-release-receipt.json"
          for script in \
            /Users/jacky/platform/governance/scripts/official-plugin/release-lane-preflight.sh \
            /Users/jacky/.local/share/platform-governance/governance/scripts/official-plugin/release-lane-preflight.sh; do
            if [ -f "$script" ]; then
              bash "$script" easybooks "$STAGED" "$receipt"
              exit 0
            fi
          done
          echo "::error::release-lane-preflight.sh not found on runner" >&2
          exit 1

      - name: Sign macOS CLI in stage
        run: |
          set -euo pipefail
          bash scripts/official-plugin/sign-macos-cli.sh sign "$STAGE/cli-aarch64-apple-darwin/easybooks"
          if [ "$IS_TAG" = "true" ]; then
            python3 scripts/assert_plugin_version.py --tag "$VERSION" --root . --binary "$STAGE/cli-aarch64-apple-darwin/easybooks"
          else
            python3 scripts/assert_plugin_version.py --root . --binary "$STAGE/cli-aarch64-apple-darwin/easybooks"
          fi

      - name: Notarize macOS binary
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          bash scripts/official-plugin/sign-macos-cli.sh notarize "$STAGE/cli-aarch64-apple-darwin/easybooks"

      - name: Seal immutable signed stage
        run: |
          set -euo pipefail
          (
            cd "$STAGE"
            shasum -a 256 cli-aarch64-apple-darwin/easybooks > cli-aarch64-apple-darwin/easybooks.sha256
            shasum -a 256 cli-x86_64-pc-windows-gnu/easybooks.exe > cli-x86_64-pc-windows-gnu/easybooks.exe.sha256
            tar czf easybooks-cli-signed-stage.tar.gz cli-aarch64-apple-darwin cli-x86_64-pc-windows-gnu
            shasum -a 256 easybooks-cli-signed-stage.tar.gz > easybooks-cli-signed-stage.tar.gz.sha256
          )

      - name: Publish source-provenance release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            "$STAGE/easybooks-cli-signed-stage.tar.gz"
            "$STAGE/easybooks-cli-signed-stage.tar.gz.sha256"
          )
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::immutable release already exists for $VERSION"
            exit 1
          fi
          gh release create "$VERSION" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "EasyBooks CLI $VERSION" \
            --notes "Signed EasyBooks plugin stage built from immutable source ${{ github.sha }}."

      - name: Load plugins deploy key
        if: env.IS_TAG == 'true'
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd
        with:
          ssh-private-key: ${{ secrets.PLUGINS_REPO_DEPLOY_KEY }}
      - name: Official marketplace publish
        if: env.IS_TAG == 'true'
        env:
          PLUGINS_REPO_DEPLOY_KEY: ${{ secrets.PLUGINS_REPO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          bash scripts/assemble-official-plugin.sh "$STAGE" "$RUNNER_TEMP/easybooks-cli"
          git clone --branch main "git@github.com:jackyzhang69/plugins.git" "$RUNNER_TEMP/plugins-repo"
          python3 scripts/official-plugin/publish-official-plugin.py \
            --plugin-id easybooks \
            --staged "$RUNNER_TEMP/easybooks-cli" \
            --marketplace "$RUNNER_TEMP/plugins-repo" \
            --apply --git-push

      - name: Teardown isolated signing keychain
        if: always()
        run: bash scripts/official-plugin/sign-macos-cli.sh teardown
