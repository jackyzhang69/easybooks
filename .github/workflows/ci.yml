name: CI

# One CI run per change: pull_request is the only automatic trigger (main is
# fast-forwarded to the tested PR head). workflow_dispatch is the manual fallback
# for a main tip that was not a fast-forward of a tested PR head.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  plugin-version-gate:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Require version bump when plugin paths change
        run: bash scripts/assert-plugin-version-bumped.sh

  test:
    # Same-owner PRs select any free Mac runner by capability labels
    # [self-hosted, macOS, ARM64]. Fork PRs do not run here.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Verify vendored jz-plugin-common pin
        run: bash scripts/official-plugin/seed-jz-plugin-common.sh

      - name: Tool versions
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version && "$HOME/.cargo/bin/cargo" --version

      - name: Skills mirror lock-step (.claude/skills == .agents/skills)
        run: |
          bash scripts/sync-skills.sh
          python3 scripts/assert_skill_command_contract.py

      - name: Version metadata lock-step
        run: |
          python3 -m py_compile scripts/assert_plugin_version.py plugin-metadata/scripts/verify-install \
            scripts/official-plugin/test_assemble_checksums.py
          python3 scripts/official-plugin/test_assemble_checksums.py
          python3 scripts/assert_plugin_version.py --root .
          python3 - <<'PY'
          from pathlib import Path
          source = Path("plugin-metadata/scripts/verify-install").read_text()
          assert '[str(binary), "--json", "doctor", "--no-fetch"]' in source
          assert '[str(binary), "doctor", "--json", "--no-fetch"]' not in source
          PY

      - name: Publish-path manifest integrity gate tests
        run: python3 scripts/official-plugin/test_publish_manifest_integrity.py -v
      - name: Cargo build (release)
        run: |
          "$HOME/.cargo/bin/cargo" build --release

      - name: Cross-build linux-x64 (zig) and verify ELF
        run: |
          set -euo pipefail
          source scripts/official-plugin/ensure-linux-toolchain.sh
          "$HOME/.cargo/bin/cargo" zigbuild --locked --release --target x86_64-unknown-linux-gnu --bin easybooks
          TARGET="$("$HOME/.cargo/bin/cargo" metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          python3 - "$TARGET/x86_64-unknown-linux-gnu/release/easybooks" <<'PY'
          import pathlib, struct, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          assert data[:4] == b"\x7fELF" and data[4] == 2 and data[5] == 1, "not 64-bit LE ELF"
          assert struct.unpack_from("<H", data, 18)[0] == 0x3E, "not x86-64"
          print("linux-x64 payload: ELF x86-64 ok")
          PY

      - name: Cargo clippy (deny warnings)
        run: |
          "$HOME/.cargo/bin/cargo" clippy --release --all-targets -- -D warnings

      - name: Cargo test (release)
        run: |
          "$HOME/.cargo/bin/cargo" test --release --all-targets 2>&1 | tee /tmp/cargo-test.log

      - name: Skill surface vs built binary
        run: |
          BIN="$("$HOME/.cargo/bin/cargo" metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')/release/easybooks"
          python3 scripts/official-plugin/assert-skill-surface.py \
            --bin "$BIN" \
            --skills "$(pwd)/.claude/skills/easybooks"
          python3 scripts/assert_skill_command_contract.py

      - name: Verify plugin identity (platform registry)
        run: |
          bash scripts/official-plugin/stage-identity-package.sh "$(pwd)/dist/identity-package"
          bash scripts/official-plugin/verify-plugin-identity.sh "$(pwd)/dist/identity-package"

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo-test-log
          path: /tmp/cargo-test.log
